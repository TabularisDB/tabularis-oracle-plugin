version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/explain"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7 (the native port) ships no JS compiler API, which tsup's
      # declaration build still imports. Revisit once tsup supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
